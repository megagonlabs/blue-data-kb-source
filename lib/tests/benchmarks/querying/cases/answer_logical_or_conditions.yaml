id: answer_logical_or_conditions
category: logical
description: >
  Healthcare domain. "A or B" composition — of three patients each diagnosed
  with a different condition, the two matching hypertension OR diabetes
  should appear; the one with a common cold should not.
operation: answer
seed_schema:
  classes:
    - {name: PATIENT, description: "A person receiving medical care"}
    - {name: CONDITION, description: "A medical condition or diagnosis"}
  relations:
    - {name: DIAGNOSED_WITH, description: "A patient has been diagnosed with a condition", domain: PATIENT, range: CONDITION}
seed_data:
  entities:
    - {name: Raj, class: PATIENT}
    - {name: Maria, class: PATIENT}
    - {name: Tom, class: PATIENT}
    - {name: hypertension, class: CONDITION}
    - {name: diabetes, class: CONDITION}
    - {name: common cold, class: CONDITION}
  facts:
    - {ref: raj_hyp, head: Raj, relation: DIAGNOSED_WITH, tail: hypertension}
    - {ref: maria_diabetes, head: Maria, relation: DIAGNOSED_WITH, tail: diabetes}
    - {ref: tom_cold, head: Tom, relation: DIAGNOSED_WITH, tail: common cold}
question: "Which patients have hypertension or diabetes?"
expected:
  rows:
    - {entity: Raj, condition: hypertension}
    - {entity: Maria, condition: diabetes}
