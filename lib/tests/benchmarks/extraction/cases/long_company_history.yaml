id: long_company_history
category: long_text
description: >
  A multi-paragraph company history: founders, funding, an acquisition, leadership
  changes and offices, spread over paragraphs that refer back to earlier ones.
  Coverage drops on long text; this measures how much survives.
input_text: |
  Meridian Analytics was founded in 2012 by Sofia Marquez and Daniel Kim in
  Austin, Texas. The company built forecasting software for retailers.

  In 2015 Meridian raised a $20 million Series B led by Accel. Two years later it
  opened a second office in London, run by Priya Shah.

  Daniel Kim stepped down as CEO in 2019 and was succeeded by Sofia Marquez. In
  2021 Meridian acquired Quantly, a pricing startup from Berlin.

  In 2023 Meridian itself was acquired by Oracle.
dedup_modes: [search]
