[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-kb-source"
version = "1.0.0"
description = "Blue Data Knowledge-Base Source Layer"
requires-python = ">=3.12,<3.14"
dependencies = [
    "blue-data>=1.0.0",
    "exceptiongroup>=1.0; python_version < '3.11'",
]

[project.optional-dependencies]
neo4j  = ["neo4j"]
openai = ["openai>=1.0"]
search = ["rank-bm25"]
mcp    = ["mcp>=1.28.1,<2"]
dev    = ["pytest", "pytest-asyncio", "pytest-recording", "pytest-cov", "pyyaml", "rich", "openai>=1.0"]
all    = ["neo4j", "openai>=1.0", "rank-bm25", "mcp>=1.28.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blue_data_kb_source = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Findings that appeared when target-version moved to py312 (#170); fix in a follow-up.
"src/blue_data_kb_source/_sync.py" = ["UP047"]
"src/blue_data_kb_source/schema/expansion.py" = ["UP041"]
"src/blue_data_kb_source/timestamps.py" = ["UP017"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ""
pythonpath = ["src", "."]
testpaths = ["tests/unit"]

[tool.coverage.run]
source = ["src"]
