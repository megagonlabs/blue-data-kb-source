[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-kb-source"
version = "0.1.0"
description = "Blue Data Knowledge-Base Source Layer"
requires-python = ">=3.10"
dependencies = [
    "blue-data>=0.1.0",
]

[project.optional-dependencies]
neo4j  = ["neo4j"]
openai = ["openai>=1.0"]
search = ["rank-bm25"]
dev    = ["pytest", "pytest-asyncio", "pytest-recording", "pytest-cov"]
all    = ["neo4j", "openai>=1.0", "rank-bm25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blue_data_kb_source = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ""
pythonpath = ["src", "."]
testpaths = ["tests/unit"]

[tool.coverage.run]
source = ["src"]
