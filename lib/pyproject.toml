[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-kb-source"
version = "1.0.0"
description = "Blue Data Knowledge-Base Source Layer"
requires-python = ">=3.12,<3.14"
dependencies = [
    "blue-data>=1.0.0",
]

[project.optional-dependencies]
# LiteLLM: 1.102 is blue-data-llm-source's floor and the oldest release tested
# with the agents' calls; 1.106 pulls mcp 2.x types into the completion path, and the `mcp`
# extra (the MCP server and schema expansion's reference servers) is pinned below 2.
neo4j  = ["neo4j"]
llm    = ["litellm>=1.102,<1.106"]
openai = ["litellm>=1.102,<1.106"]  # the former name of `llm`, kept for existing install commands
search = ["rank-bm25"]
mcp    = ["mcp>=1.28.1,<2"]
dev    = ["pytest", "pytest-asyncio", "pytest-recording", "pytest-cov", "pyyaml", "rich", "litellm>=1.102,<1.106"]
all    = ["neo4j", "litellm>=1.102,<1.106", "rank-bm25", "mcp>=1.28.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blue_data_kb_source = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ""
pythonpath = ["src", "."]
testpaths = ["tests/unit"]

[tool.coverage.run]
source = ["src"]
