[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-wordnet-mcp"
version = "1.0.0"
description = "MCP server exposing WordNet lexical lookups (via nltk) to LLM clients"
requires-python = ">=3.10,<3.15"
dependencies = [
    "mcp[cli]>=1.28.1,<2",
    "nltk>=3.8",
]

[project.scripts]
blue-data-wordnet-mcp = "blue_data_wordnet_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
