[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-data-kb-cli"
version = "0.1.0"
description = "CLI for Blue Data Knowledge-Base Source"
requires-python = ">=3.10"
dependencies = [
    "blue-data-kb-source>=0.1.0",
    "click>=8.0",
    "rich>=13.0",
    "arrow>=1.3",
]

[project.scripts]
blue-kb = "blue_data_kb_cli.commands:cli"

[project.optional-dependencies]
dev    = ["pytest", "pytest-asyncio"]
neo4j  = ["neo4j>=5.0"]
chromadb = ["chromadb>=0.4"]
redis  = ["redis>=5.0"]
openai = ["openai>=1.0"]
all    = ["neo4j>=5.0", "chromadb>=0.4", "redis>=5.0", "openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
